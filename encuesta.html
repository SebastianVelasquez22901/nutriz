<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Encuesta Nutriz</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Nutriz">
  <div class="tarjeta" id="tarjeta"></div>
  <p class="pie"><a href="./">Volver al inicio</a></p>
</main>
<script src="participante.js"></script>
<script>
const ESCALA = 'De 1 (totalmente en desacuerdo) a 5 (totalmente de acuerdo)';
// Los valores deben coincidir con backend/src/encuesta/dto.ts.
const PERFIL = [
  ['edad', '¿Cuántos años tienes?', [['18-25', '18 a 25'], ['26-35', '26 a 35'], ['36-45', '36 a 45'], ['46-60', '46 a 60'], ['61+', '61 o más']]],
  ['escolaridad', '¿Hasta qué grado estudiaste?', [['ninguna', 'No estudié'], ['primaria', 'Primaria'], ['basicos', 'Básicos'], ['diversificado', 'Diversificado'], ['universidad', 'Universidad']]],
  ['areaSalud', '¿Trabajas o estudias en el área de salud?', [['si', 'Sí'], ['no', 'No']]],
  ['anosTelefono', '¿Cuántos años llevas usando un teléfono inteligente?', [['<1', 'Menos de 1 año'], ['1-3', '1 a 3 años'], ['4-6', '4 a 6 años'], ['>6', 'Más de 6 años']]],
  ['equipo', '¿En qué equipo probaste la aplicación?', [['telefono', 'Teléfono'], ['tablet', 'Tablet']]],
];
// SUS en español, tal como lo publican Sevilla-Gonzalez et al. (2020, anexo 2).
const SUS = [
  'Me gustaría usar esta herramienta frecuentemente.',
  'Considero que esta herramienta es innecesariamente compleja',
  'Considero que la herramienta es fácil de usar.',
  'Considero necesario el apoyo de personal experto para poder utilizar esta herramienta',
  'Considero que las funciones de la herramienta están bien integradas',
  'Considero que la herramienta presenta muchas contradicciones',
  'Imagino que la mayoría de las personas aprenderían a usar esta herramienta rápidamente',
  'Considero que el uso de esta herramienta es tedioso',
  'Me sentí muy confiado al usar la herramienta',
  'Necesité saber bastantes cosas antes de poder empezar a usar esta herramienta',
];
const INSTRUCCIONES_SUS = 'Por favor seleccione de cada uno de los enunciados la opción que mejor describa su experiencia con la herramienta electrónica. Un puntaje de 1 significa que usted se encuentra totalmente en desacuerdo con el enunciado, mientras que un puntaje en 5 significa que está totalmente de acuerdo, un puntaje de 3 significaría que usted se encuentra neutral con el enunciado.';
// Una por cada parte del objetivo general: recolectar (1, 2), analizar (3), gestionar (4) y sin conexión (5). No es
// un instrumento validado: se reporta como complemento descriptivo del SUS. Deben coincidir con resultados.html.
const TAREAS = [
  'Fue fácil anotar los datos del niño y su medición.',
  'Fue fácil llenar el cuestionario de riesgo.',
  'Entendí qué significa el color del resultado y qué debo hacer.',
  'Supe cuándo mis datos ya habían llegado al servidor.',
  'Me sentiría seguro de usar la aplicación en un lugar sin internet.',
];
// Lo que en la prueba presencial observaba el facilitador (T115). Lo correcto en la tarea 3 es amarillo y seguimiento.
const COMPRENSION = [
  ['color', 'En la tarea 3, ¿de qué color salió el resultado de María?', [['verde', 'Verde'], ['amarillo', 'Amarillo'], ['rojo', 'Rojo'], ['gris', 'Gris'], ['no_se', 'No me acuerdo']]],
  ['accion', 'Según la aplicación, ¿qué había que hacer con María?', [['nada', 'Nada, está bien'], ['seguimiento', 'Darle seguimiento y consejería'], ['referir', 'Referirla al servicio de salud'], ['revisar', 'Revisar las medidas'], ['no_se', 'No sé']]],
  ['buscar', 'En la tarea 6, ¿pudiste encontrar a María y abrir su ficha?', [['si', 'Sí'], ['no', 'No'], ['no_intente', 'No lo intenté']]],
  ['ayuda', '¿Alguien te ayudó durante las tareas?', [['si', 'Sí'], ['no', 'No']]],
  ['manual', '¿Usaste el manual de uso?', [['si', 'Sí'], ['no', 'No']]],
];

// Quien aceptó participar en la portada ya dio su consentimiento y tiene número; si no, lo da aquí y el servidor le
// asigna uno al enviar.
const yaParticipa = participanteGuardado();

// Cada paso es una pantalla. `cuenta` marca las preguntas que suman en la barra de progreso.
const PASOS = [
  { tipo: 'inicio' },
  ...(yaParticipa ? [] : [{ tipo: 'consentimiento', cuenta: true }]),
  ...PERFIL.map(([campo, texto, opciones]) => ({ tipo: 'opciones', seccion: 'Sobre ti', campo, texto, opciones, cuenta: true })),
  { tipo: 'aviso', seccion: 'Tu experiencia', texto: INSTRUCCIONES_SUS },
  ...SUS.map((texto, i) => ({ tipo: 'likert', seccion: 'Tu experiencia', campo: `sus${i}`, texto, cuenta: true })),
  ...TAREAS.map((texto, i) => ({ tipo: 'likert', seccion: 'Las tareas que hiciste', campo: `tarea${i}`, texto, cuenta: true })),
  ...COMPRENSION.map(([campo, texto, opciones]) => ({ tipo: 'opciones', seccion: 'Las tareas que hiciste', campo, texto, opciones, cuenta: true })),
  { tipo: 'texto', seccion: 'En tus palabras (opcional)', campo: 'dificil', texto: '¿Qué fue lo más difícil o confuso?', cuenta: true },
  { tipo: 'texto', seccion: 'En tus palabras (opcional)', campo: 'cambiaria', texto: '¿Qué le cambiarías a la aplicación?', cuenta: true },
  { tipo: 'enviar' },
];
const TOTAL = PASOS.filter((p) => p.cuenta).length;

// Las respuestas se guardan en esta pestaña: si la página se recarga, no se pierden.
let r = {};
try { r = JSON.parse(sessionStorage.getItem('encuesta') ?? '{}'); } catch { r = {}; }
const guardar = () => { try { sessionStorage.setItem('encuesta', JSON.stringify(r)); } catch {} };
let i = 0;
// Evita que un doble toque rápido salte una pregunta mientras se pasa a la siguiente.
let avanzando = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function cabecera(paso) {
  const n = PASOS.slice(0, i + 1).filter((p) => p.cuenta).length;
  return `<div class="progreso"><button class="atras" type="button" data-accion="atras">‹ Atrás</button>`
    + `<div class="barra"><div style="width:${Math.round(n / TOTAL * 100)}%"></div></div><small>${n} de ${TOTAL}</small></div>`
    + (paso.seccion ? `<div class="seccion">${paso.seccion}</div>` : '');
}

function pintar() {
  const p = PASOS[i];
  let html = '';
  if (p.tipo === 'inicio') {
    html = `<h1>¿Cómo te fue con Nutriz?</h1><p>Son ${TOTAL} preguntas cortas, unos 4 minutos. Toca una respuesta y pasa sola a la siguiente.</p>`
      + `<p>No hay respuestas buenas ni malas: evaluamos la aplicación, no a ti. No te pedimos tu nombre.</p>`
      + `<button type="button" data-accion="siguiente">Empezar</button>`;
  } else if (p.tipo === 'consentimiento') {
    html = cabecera(p) + `<p class="pregunta-texto">Antes de seguir</p>`
      + `<p>Tus respuestas se guardan sin tu nombre y se usan de forma agregada en una tesis de la Universidad de San Carlos de Guatemala. Puedes dejar la encuesta cuando quieras.</p>`
      + `<button type="button" data-accion="acepto">Acepto y sigo</button>`;
  } else if (p.tipo === 'opciones') {
    html = cabecera(p) + `<p class="pregunta-texto">${p.texto}</p><div class="lista-opciones">`
      + p.opciones.map(([v, t]) => `<button type="button" data-valor="${v}" class="${r[p.campo] === v ? 'elegido' : ''}">${t}</button>`).join('') + '</div>';
  } else if (p.tipo === 'aviso') {
    html = cabecera(p) + `<p class="pregunta-texto">Ahora, 10 frases sobre la aplicación</p><p>${p.texto}</p>`
      + `<button type="button" data-accion="siguiente">Seguir</button>`;
  } else if (p.tipo === 'likert') {
    html = cabecera(p) + `<p class="pregunta-texto">${p.texto}</p><div class="likert" role="group" aria-label="${ESCALA}">`
      + [1, 2, 3, 4, 5].map((v) => `<button type="button" data-valor="${v}" class="${r[p.campo] === v ? 'elegido' : ''}">${v}</button>`).join('')
      + '</div><div class="extremos"><span>Totalmente en desacuerdo</span><span>Totalmente de acuerdo</span></div>';
  } else if (p.tipo === 'texto') {
    html = cabecera(p) + `<p class="pregunta-texto">${p.texto}</p>`
      + `<textarea id="texto" maxlength="1500" placeholder="Escribe aquí (puedes dejarlo vacío)">${esc(r[p.campo] ?? '')}</textarea>`
      + `<button type="button" data-accion="texto">Siguiente</button>`;
  } else if (p.tipo === 'enviar') {
    html = cabecera(p) + `<p class="pregunta-texto">¡Listo! Ya respondiste todo.</p><p>Toca el botón para enviar tus respuestas.</p>`
      + `<button type="button" data-accion="enviar" id="enviar">Enviar la encuesta</button><div class="error" id="error" role="alert" hidden></div>`;
  } else if (p.tipo === 'gracias') {
    html = `<div class="exito">¡Gracias! Tu encuesta se guardó.</div>`
      + `<p class="pregunta-texto" style="margin-top:16px">Participante ${esc(p.participante)}</p>`
      + `<p>Ya terminaste. Ahora desinstala Nutriz: mantén presionado su ícono y toca <b>Desinstalar</b>. Se borra todo lo que tenía.</p>`
      + `<a class="boton secundario" href="./">Volver al inicio</a>`;
  }
  $('tarjeta').innerHTML = `<div class="paso">${html}</div>`;
  $('texto')?.focus();
}

const ir = (paso) => { avanzando = false; i = Math.max(0, Math.min(PASOS.length - 1, paso)); pintar(); window.scrollTo({ top: 0 }); };

async function enviar() {
  // Por si alguien llegó al final saltándose una pantalla (no debería poder): vuelve a la primera sin responder.
  const falta = PASOS.findIndex((p) => p.cuenta && p.tipo !== 'texto'
    && (p.tipo === 'consentimiento' ? !r.consentimiento : r[p.campo] === undefined));
  if (falta >= 0) return ir(falta);
  $('enviar').disabled = true;
  $('enviar').textContent = 'Enviando…';
  const cuerpo = {
    participante: yaParticipa?.participante,
    consentimiento: true,
    perfil: Object.fromEntries(PERFIL.map(([c]) => [c, r[c]])),
    sus: SUS.map((_, k) => r[`sus${k}`]),
    tareas: TAREAS.map((_, k) => r[`tarea${k}`]),
    comprension: Object.fromEntries(COMPRENSION.map(([c]) => [c, r[c]])),
    comentarios: Object.fromEntries(['dificil', 'cambiaria'].map((c) => [c, (r[c] ?? '').trim()]).filter(([, v]) => v)),
  };
  try {
    let res;
    try {
      res = await enviarJson('/encuesta', cuerpo);
    } catch (err) {
      // El número guardado ya no existe en el servidor (por ejemplo, se borró una prueba): se envía sin número y el
      // servidor asigna uno nuevo.
      if (err.status !== 400 || !cuerpo.participante) throw err;
      olvidarParticipante();
      res = await enviarJson('/encuesta', { ...cuerpo, participante: undefined });
    }
    const { participante } = res;
    try { sessionStorage.removeItem('encuesta'); } catch {}
    PASOS.push({ tipo: 'gracias', participante });
    ir(PASOS.length - 1);
  } catch {
    $('error').textContent = 'No se pudo enviar. Revisa tu conexión a internet y toca "Enviar" otra vez; tus respuestas siguen aquí.';
    $('error').hidden = false;
    $('enviar').disabled = false;
    $('enviar').textContent = 'Enviar la encuesta';
  }
}

$('tarjeta').addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  const p = PASOS[i];
  const accion = b.dataset.accion;
  if (accion === 'atras') return ir(i - 1);
  if (accion === 'siguiente') return ir(i + 1);
  if (accion === 'acepto') { r.consentimiento = true; guardar(); return ir(i + 1); }
  if (accion === 'texto') { r[p.campo] = $('texto').value; guardar(); return ir(i + 1); }
  if (accion === 'enviar') return enviar();
  if (b.dataset.valor !== undefined) {
    if (avanzando) return;
    avanzando = true;
    const valor = p.tipo === 'likert' ? Number(b.dataset.valor) : b.dataset.valor;
    r[p.campo] = valor;
    guardar();
    b.parentElement.querySelectorAll('button').forEach((x) => x.classList.toggle('elegido', x === b));
    // Un instante para que se vea lo elegido antes de pasar a la siguiente.
    setTimeout(() => ir(i + 1), 220);
  }
});

pintar();
</script>
</body>
</html>
